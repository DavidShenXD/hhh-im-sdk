# ============================================================
# hhh-im-protocol —— HHH-IM-Protocol 的线上类型、编解码与传输
#
# 宿主（hhh-im 的 provider 适配器）和所有外部 IM 插件共用这一份正本。
# 线上类型独立于 hhh-im 的内部类型定义、独立定版、独立冻结：
# hhh-im 的内部模型怎么改，都不破坏已经发布的插件（由适配器翻译）。
#
# 规范：docs/protocol-v1.md（从 HHH 仓库同步，HHH 仓库是唯一正本）
#
#   hhh-im（provider 适配器，feature="provider"）   外部插件（如微信，独立仓库）
#               ↓ transport                                ↓
#         hhh-im-protocol（本包）  ← 线上类型 + JSON-RPC 编解码 + 传输 trait
# ============================================================

[package]
name = "hhh-im-protocol"
# 协议包自己定版、不跟 HHH 走：公开仓库 hhh-im-sdk 按这个版本打标签（scripts/im-sdk-export.py 读它）。
version = "0.12.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MagicLizi/hhh-im-sdk"
description = "HHH-IM-Protocol：HHH 的 IM 插件协议（线上类型、编解码、传输、安装包）"

[features]
default = []
# transport：子进程 stdio 传输（tokio）。宿主侧（hhh-im provider 适配器、自检工具）开它；
# 只用线上类型与编解码的一方可以不开。
transport = ["dep:tokio", "dep:regex-lite"]
# runtime：写插件程序用的运行时（契约 provider-protocol v15 §3.4）：协议服务（并发处理、取消、向宿主发请求等回复）、
# 日志转 log/write、资源分段读、上传攒齐与核对、平台请求计数。只给插件开，HHH 宿主不用。
# 编 WASM 包（wasm32-wasip2，iPhone / iPad 用，契约 provider-protocol v18）时，运行时的标准输入输出改走 WASI 的接口（wasip2）。
runtime = ["dep:tokio", "dep:tracing-subscriber", "dep:base64", "dep:sha2", "dep:wasip2"]
# package：安装包 .hhhim 的打包、读清单与解包（宿主安装与更新、打包工具 hhh-im-pack 用）。
package = ["dep:zip", "dep:sha2", "dep:ed25519-dalek", "dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
# 异步读写、计时、通道（transport 与 runtime 用）。子进程与标准输入输出在下面按目标加：WASM 上 tokio 没有它们。
tokio = { version = "1", default-features = false, optional = true, features = ["rt", "io-util", "time", "sync", "macros"] }
# 自检工具核对插件声明的正文表情写法能不能编译（契约 provider-protocol v12 缺口 9），只在 transport feature 下用。
regex-lite = { version = "0.1", optional = true }
# 插件运行时：tracing 日志接成 log/write（只用注册表部件）、资源与上传按 base64 传，只在 runtime feature 下用。
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"], optional = true }
base64 = { version = "0.22", optional = true }
# 安装包：zip 读写与 sha256（runtime 也用 sha256 核对上传），只在 package、runtime feature 下用。
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.11", optional = true }
# 打包工具的官方签名（keygen 与 --sign-key，契约 provider-protocol v14）：ed25519 与生成钥匙用的系统随机数，只在 package feature 下用。
ed25519-dalek = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# 子进程（transport 起插件）与标准输入输出（runtime 的 serve_stdio）：只在原生目标上开。
tokio = { version = "1", default-features = false, optional = true, features = ["process", "io-std"] }

[target.'cfg(target_os = "wasi")'.dependencies]
# WASI 0.2 的接口绑定：WASM 包里非阻塞地读标准输入（runtime 的 serve_stdio）。
wasip2 = { version = "1", optional = true }

[dev-dependencies]
# wiremock：发布（--publish）的端到端测试里当 GitHub、GitLab。
wiremock = { version = "0.6" }
# tempfile：测试用的临时目录。
tempfile = { version = "3" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

# 自检工具：拿任意插件把协议用例跑一遍。第三方开发者自测、HHH 验收都用它。
[[bin]]
name = "hhh-im-check"
path = "src/bin/hhh_im_check.rs"
required-features = ["transport"]

# 打包工具：把插件文件夹打成 .hhhim、写版本索引（契约 provider-protocol v10 §4.3）。插件仓库模板的打包脚本用它。
[[bin]]
name = "hhh-im-pack"
path = "src/bin/hhh_im_pack.rs"
required-features = ["package"]

